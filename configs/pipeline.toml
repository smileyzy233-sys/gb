[paths]
annual_reports_dir = "年报"
gb_mapping_csv = "GB映射参考数据库/GB_dict.csv"
keyword_file = "configs/standard_keywords.txt"
prompt_file = "prompts/extract_standards_zh.txt"

[preprocess]
min_chapter_chars = 500
target_chapter_keywords = [
  "经营情况",
  "管理层讨论",
  "核心竞争力",
  "环境",
  "社会责任",
  "公司治理",
  "重要事项",
  "董事会报告",
]

[main_regression]
text_unit_min_chars = 600
text_unit_max_chars = 1200

[extract]
provider = "api"
workers = 4
batch_size = 20
max_retries = 3
retry_min_seconds = 2
retry_max_seconds = 10

[stage1]
workers = 16
batch_size = 100
max_retries = 3
retry_min_seconds = 2
retry_max_seconds = 10

[stage1.api]
api_key_env = "STANDARD_PIPELINE_API_KEY"
base_url_env = "STANDARD_PIPELINE_BASE_URL"
model_env = "STANDARD_PIPELINE_MODEL"
base_url = "http://127.0.0.1:18000/v1"
model = "qwen3.5-9b"
temperature = 0.0
json_response_format = true
max_tokens = 256

[stage1.api.extra_body.chat_template_kwargs]
enable_thinking = false

[stage1.vllm_batch]
model_path_env = "LOCAL_MODEL_PATH"
model_path = "/home/suati/桌面/kernel/model/Qwen3.5-9B"
dtype = "auto"
trust_remote_code = true
tensor_parallel_size = 1
gpu_memory_utilization = 0.90
max_model_len = 4096
chunk_size = 64
temperature = 0.0
max_tokens = 192
enforce_eager = false
enable_lora = false
lora_path = ""
lora_rank = 32

[stage2]
workers = 12
batch_size = 50
max_retries = 3
retry_min_seconds = 2
retry_max_seconds = 10

[stage2.api]
api_key_env = "STANDARD_PIPELINE_API_KEY"
base_url_env = "STANDARD_PIPELINE_BASE_URL"
model_env = "STANDARD_PIPELINE_MODEL"
base_url = "http://127.0.0.1:18000/v1"
model = "qwen3.5-9b"
temperature = 0.0
json_response_format = true
max_tokens = 384

[stage2.api.extra_body.chat_template_kwargs]
enable_thinking = false

[stage2.vllm_batch]
model_path_env = "LOCAL_MODEL_PATH"
model_path = "/home/suati/桌面/kernel/model/Qwen3.5-9B"
dtype = "auto"
trust_remote_code = true
tensor_parallel_size = 1
gpu_memory_utilization = 0.90
max_model_len = 16384
chunk_size = 8
temperature = 0.0
max_tokens = 3072
enforce_eager = false
enable_lora = false
lora_path = ""
lora_rank = 32

[stage2.safe_recovery]
enabled = true
strict_outer_json = true
structured_output = true
repair_once = true
detect_repetition = true
retry_on_parse_failure = true
retry_on_repetition = true
max_generation_attempts = 2
grounding_mode = "audit"
repetition_min_chars = 1000
repetition_compression_ratio = 0.20
audit_raw_max_chars = 4000
